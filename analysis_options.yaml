# Halaqah Flutter analyzer baseline.
# Kept dependency-free so a source checkout can be analyzed before optional
# lint packages are fetched. These rules focus on correctness and privacy
# without introducing a large style-only migration in a hotfix release.

analyzer:
  errors:
    avoid_print: error
    no_duplicate_case_values: error
    valid_regexps: error

linter:
  rules:
    avoid_print: true
    avoid_types_as_parameter_names: true
    await_only_futures: true
    control_flow_in_finally: true
    no_duplicate_case_values: true
    no_logic_in_create_state: true
    prefer_void_to_null: true
    throw_in_finally: true
    unrelated_type_equality_checks: true
    use_rethrow_when_possible: true
    valid_regexps: true
