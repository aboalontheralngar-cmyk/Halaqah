name: halaqah_teacher
description: تطبيق حلقتي - لإدارة الحلقات القرآنية
publish_to: 'none'
version: 4.3.0-alpha.27+84

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: 1.0.9
  
  # Local Storage
  sqflite: 2.4.2+1
  path: 1.9.1
  path_provider: 2.1.5
  
  qr_flutter: 4.1.0
  mobile_scanner: 7.2.0
  
  pdf: 3.12.0
  printing: 5.14.3
  
  hijri: 3.0.0
  
  shared_preferences: 2.5.5
  intl: 0.20.2
  uuid: 4.5.3
  crypto: 3.0.7
  cryptography: 2.9.0
  cryptography_flutter: 2.3.4
  flutter_secure_storage: 10.3.1
  workmanager: 0.9.0+3
  
  permission_handler: 12.0.1
  image_picker: 1.2.2
  flutter_slidable: 4.0.3
  share_plus: 10.0.3
  supabase_flutter: 2.14.2
  flutter_contacts: 1.1.9+2
  adhan: 2.0.0+1


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    - assets/quran_data.json
    # Tajawal ثابت لواجهة Flutter وتقارير PDF لضمان وضوح العربية واتصال الحروف.
    - assets/fonts/Tajawal-400.ttf
    - assets/fonts/Tajawal-700.ttf

  # خط عربي ثابت موحد بين واجهة التطبيق وتقارير PDF.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-400.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-700.ttf
          weight: 700
